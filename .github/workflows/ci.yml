name: CI - Validacao do projeto

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  PROJECT_DIR: "DevOps/DevOps.Atividades"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar HTMLHint
        run: npm install --no-save htmlhint

      - name: Validar arquivos principais
        run: |
          test -f "$PROJECT_DIR/index.html"
          test -f "$PROJECT_DIR/style.css"
          test -f "$PROJECT_DIR/script.js"

      - name: Validar HTML
        run: npx htmlhint "$PROJECT_DIR/**/*.html"

      - name: Validar sintaxe JavaScript
        run: |
          find "$PROJECT_DIR" -name "*.js" -print0 | xargs -0 -I{} node --check "{}"
      - name: Executar testes unitarios
        run: node --test "$PROJECT_DIR/tests/script.test.js"
